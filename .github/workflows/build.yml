name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified NSIS 3.11 toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          Invoke-WebRequest 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') { throw 'NSIS hash mismatch' }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'nsis')
      - name: Build application and installer
        shell: pwsh
        run: |
          & .\source\build.ps1 -NsisCompiler (Join-Path $env:RUNNER_TEMP 'nsis\nsis-3.11\makensis.exe')
      - name: Test search and file change integration
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'findlite-tests'
          foreach ($mode in @('--self-test', '--ui-test', '--startup-test', '--menu-test')) {
            $process = Start-Process (Resolve-Path .\portable\FindLite.exe) -ArgumentList @($mode,$root) -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$mode failed" }
          }
      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts | Out-Null
          Copy-Item FindLite-1.0.1-Setup-x64.exe artifacts
          Compress-Archive portable\* artifacts\FindLite-1.0.1-Windows-x64.zip
          git archive --format=zip --output=artifacts/FindLite-1.0.1-Source.zip HEAD
          Get-ChildItem artifacts -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.Name } | Set-Content artifacts\SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FindLite-windows-x64
          path: artifacts/*

  release:
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.event.head_commit.message == 'Release FindLite v1.0.1')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FindLite-windows-x64
          path: artifacts
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo 'v1.0.1 already exists; published assets are left unchanged.'
          else
            gh release create v1.0.1 artifacts/* --target "$COMMIT_SHA" --title 'FindLite 1.0.1' --notes '修复关闭“更多”菜单后可能出现的 ContextMenuStrip 已释放异常，并增加菜单生命周期回归测试。MIT 开源。支持 Windows 10/11 x64，需要 .NET Framework 4.8+。包含安装版、免安装版和源码包。文件名搜索、模糊匹配、侧栏分类、文件监听、确认后回收站删除和 CSV 导出。安装包未做代码签名；首次索引采用目录遍历，尚无 MFT/USN 索引。'
          fi
